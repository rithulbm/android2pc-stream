name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    name: CLI tests and artifact hashes
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify published artifact hashes
        shell: pwsh
        run: |
          Get-Content -LiteralPath SHA256SUMS.txt | ForEach-Object {
            if ([string]::IsNullOrWhiteSpace($_)) { return }
            $parts = $_ -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Malformed SHA256SUMS line: $_" }
            $expected = $parts[0].ToUpperInvariant()
            $path = $parts[1]
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actual -ne $expected) {
              throw "SHA-256 mismatch for ${path}. Expected $expected, received $actual"
            }
            Write-Host "OK $path"
          }

      - name: Run CLI tests
        run: node cli/test/cli.test.js

  android:
    name: Android unit tests and release APK
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.31.6"
          log-accepted-android-sdk-licenses: true

      - name: Refresh verification metadata for diagnosis
        working-directory: mobile
        shell: pwsh
        run: |
          .\gradlew.bat --no-configuration-cache --no-daemon --write-verification-metadata sha256 help
          Get-ChildItem -Path "$HOME\.gradle\caches" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'guava-parent-33.4.0-jre.pom' -or $_.Name -eq 'junit-bom-5.11.0-M2.module' } |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "VERIFICATION_SHA256 $($_.Name) $hash"
            }

      - name: Unit tests and release assemble
        working-directory: mobile
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME) { throw "ANDROID_HOME is not set" }
          $env:ANDROID_NDK_HOME = Join-Path $env:ANDROID_HOME 'ndk\29.0.14206865'
          if (-not (Test-Path -LiteralPath $env:ANDROID_NDK_HOME)) {
            throw "Pinned NDK is missing: $($env:ANDROID_NDK_HOME)"
          }
          .\gradlew.bat --no-configuration-cache --no-daemon testDebugUnitTest assembleRelease

  windows:
    name: Windows receiver build and tests
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap pinned OBS headers
        shell: pwsh
        run: .\pc\scripts\bootstrap-windows.ps1

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S pc -B pc/build -G "Visual Studio 17 2022" -A x64 -T v143 -DLOCAL_CAMERA_BUILD_TESTS=ON

      - name: Build receiver, plugin, pairing app, and tests
        shell: pwsh
        run: |
          cmake --build pc/build --config Release --target receiver_tests local_camera_receiver local_camera_pairing --parallel 8

      - name: Run receiver tests
        shell: pwsh
        run: .\pc\build\Release\receiver_tests.exe
